name: paysplit
description: "PaySplit is a fintech app that automatically routes a user's incoming salary into multiple destinations — savings and transfers to other people — based on rules the user defines, executed automatically every pay cycle."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.4
  flutter_svg: ^2.4.0
  intl: ^0.20.2
  file_selector: ^1.1.0
  liquid_glass_widgets: 1.14.0
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  image_picker: ^1.2.4
  camera: ^0.12.2
  share_plus: ^13.3.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/icons/
    - assets/icons/kyc/
    - assets/icons/dashboard/
    - assets/icons/setup/
    - assets/icons/destinations/
    - assets/icons/rules/
    - assets/icons/history/
    - assets/icons/settings/
    - assets/icons/setup-progress/
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Variable.ttf
          weight: 500
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
          weight: 400
    - family: Switzer
      fonts:
        - asset: assets/fonts/Switzer-Regular.otf
          weight: 400
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/Inter-700.ttf
          weight: 700
    - family: Satoshi
      fonts:
        - asset: assets/fonts/Satoshi-Bold.otf
          weight: 700
    - family: Arimo
      fonts:
        - asset: assets/fonts/Arimo-700.ttf
          weight: 700
    - family: DM Sans
      fonts:
        - asset: assets/fonts/DMSans-400.ttf
          weight: 400
        - asset: assets/fonts/DMSans-600.ttf
          weight: 600
        - asset: assets/fonts/DMSans-500.ttf
          weight: 500
